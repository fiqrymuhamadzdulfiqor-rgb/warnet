<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking PC - CyberNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .bg-glow { position: fixed; top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(50px); }
        .bg-glow-2 { position: fixed; bottom: -20%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(250,204,21,0.1) 0%, transparent 70%); z-index: -1; filter: blur(50px); }

        .form-container {
            width: 100%; max-width: 500px; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px);
            border: 1px solid rgba(56,189,248,0.15); border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header-title { text-align: center; margin-bottom: 30px; }
        .header-title h1 { font-size: 28px; font-weight: 900; color: white; margin-bottom: 5px; }
        .header-title p { color: #94a3b8; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #cbd5e1; font-weight: 600; margin-bottom: 8px; }
        
        input, select {
            width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 15px; transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #38bdf8; background: rgba(15, 23, 42, 0.9); }
        select option { background: #0f172a; color: white; }

        .btn-submit {
            width: 100%; padding: 16px; background: #38bdf8; color: #0f172a; border: none;
            border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: #0ea5e9; box-shadow: 0 10px 25px rgba(56,189,248,0.4); transform: translateY(-2px); }

        .back-home { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .back-home:hover { color: white; }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="form-container">
    <div class="header-title">
        <h1>🎟️ Tiket Reservasi PC</h1>
        <p>Isi data untuk melanjutkan ke pemilihan komputer</p>
    </div>

    <form action="/proses-reservasi" method="post" th:object="${reservasi}">
        <div class="form-group">
            <label>Nama Pemain (In-Game Name)</label>
            <input type="text" name="nama" th:value="${session.user != null ? session.user.nama : ''}" placeholder="Ketik nama kamu..." required>
        </div>

        <div class="form-group">
            <label>Rencana Durasi Main (Jam)</label>
            <input type="number" name="durasi" placeholder="Contoh: 2" min="1" required>
        </div>

        <div class="form-group">
            <label>Waktu Kedatangan</label>
            <input type="datetime-local" name="waktuBooking" required>
        </div>

        <button type="submit" class="btn-submit">Lanjut Pilih PC →</button>
    </form>
    
    <a href="/" class="back-home">Batalkan & Kembali</a>
</div>

</body>
</html>
