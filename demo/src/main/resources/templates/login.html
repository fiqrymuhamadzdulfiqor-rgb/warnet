<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - CyberNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .bg-glow { position: fixed; top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(50px); }
        .bg-glow-2 { position: fixed; bottom: -20%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(244, 63, 94, 0.1) 0%, transparent 70%); z-index: -1; filter: blur(50px); }

        .login-box {
            width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px);
            border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; position: relative;
        }

        .icon-avatar { font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.6)); }
        
        h2 { font-size: 28px; font-weight: 900; margin-bottom: 5px; color: white; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }

        .error-msg { background: rgba(244, 63, 94, 0.2); border: 1px solid #f43f5e; color: #fda4af; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 14px; transition: 0.3s;
        }
        input:focus { outline: none; border-color: #8b5cf6; background: rgba(15, 23, 42, 0.9); }
        
        .btn-submit {
            width: 100%; padding: 15px; background: #8b5cf6; color: white; border: none;
            border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        .btn-submit:hover { background: #7c3aed; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4); transform: translateY(-2px); }
        
        .back-home { position: absolute; top: 30px; left: 30px; color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .back-home:hover { color: white; }
    </style>
</head>
<body>

<a href="/" class="back-home">← Kembali</a>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="login-box">
    <div class="icon-avatar">🛡️</div>
    <h2>Sistem Root</h2>
    <p class="subtitle">Otorisasi Operator CyberNet</p>

    <div th:if="${param.error}" class="error-msg">
        Akses Ditolak. Kredensial tidak valid.
    </div>

    <form action="/login" method="post">
        <input type="text" name="username" placeholder="ID Operator" required>
        <input type="password" name="password" placeholder="Kode Akses" required>
        <button type="submit" class="btn-submit">Buka Enkripsi</button>
    </form>
</div>

</body>
</html>
