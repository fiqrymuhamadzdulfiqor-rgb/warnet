<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kelola Menu F&B - CyberNet Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body {
            min-height:100vh; background: radial-gradient(circle at top, #1e293b, #0f172a); color:white; padding:30px;
        }
        .container {
            max-width:1100px; margin:auto; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px);
            padding:30px; border-radius:18px; border:1px solid rgba(56,189,248,0.15); box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }
        .header-title {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-title h1 { color: #38bdf8; font-size: 24px; }
        .back-btn {
            color: #94a3b8; text-decoration: none; font-weight: 600; padding: 8px 16px;
            border-radius: 8px; border: 1px solid #94a3b8; transition: 0.3s;
        }
        .back-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        /* FORM STYLE */
        form {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 12px; align-items: center;
            background: rgba(15, 23, 42, 0.4); padding: 20px; border-radius: 12px; margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        input, select {
            width:100%; padding:12px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(56,189,248,0.2);
            border-radius:8px; color: white; font-size: 14px;
        }
        input:focus, select:focus { border-color: #38bdf8; outline: none; }
        select option { background: #0f172a; color: white; }
        button {
            padding:12px 20px; background:#38bdf8; color:#0f172a; font-weight:bold;
            border:none; border-radius:8px; cursor:pointer; transition: 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* TABLE STYLE */
        table { width:100%; border-collapse:collapse; }
        th { background: rgba(56,189,248,0.1); color: #38bdf8; padding: 15px; text-align: left; font-size: 14px;}
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; font-size: 14px;}
        tr:hover td { background: rgba(255,255,255,0.02); }

        .badge-kat { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .poin-text { color: #facc15; font-weight: bold; }
        .hapus-btn { color: #fb7185; text-decoration: none; font-size: 14px; font-weight: 600; }
        .hapus-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">

    <div class="header-title">
        <h1>🍔 Kelola Menu Makanan & Minuman</h1>
        <a href="/admin" class="back-btn">← Ke Dashboard</a>
    </div>

    <form action="/admin/save-menu" method="post" th:object="${menuBaru}">
        <input type="text" name="namaMenu" placeholder="Nama Makanan / Minuman" required>
        
        <select name="kategori" required>
            <option value="" disabled selected>Kategori</option>
            <option value="Makanan">Makanan</option>
            <option value="Minuman">Minuman</option>
        </select>
        
        <input type="number" name="hargaRupiah" placeholder="Harga (Rp)" required>
        <input type="number" name="hargaPoin" placeholder="Harga Poin (pts)" required>
        
        <button type="submit">➕ Tambah</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Nama Menu</th>
            <th>Kategori</th>
            <th>Harga Rupiah</th>
            <th>Harga Poin (Member)</th>
            <th>Aksi</th>
        </tr>

        <tr th:each="m : ${daftarMenu}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.namaMenu}" style="font-weight: 600; color: white;"></td>
            <td><span class="badge-kat" th:text="${m.kategori}"></span></td>
            <td th:text="'Rp ' + ${#numbers.formatDecimal(m.hargaRupiah,0,'COMMA',0,'POINT')}"></td>
            <td class="poin-text" th:text="${m.hargaPoin} + ' pts'"></td>
            <td>
                <a class="hapus-btn" th:href="@{/admin/delete-menu/{id}(id=${m.id})}" onclick="return confirm('Hapus menu ini?')">Hapus</a>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
