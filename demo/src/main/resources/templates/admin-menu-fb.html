<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kelola Menu F&B - NexaNet Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { min-height:100vh; background: #0f172a; color:white; padding:30px; position: relative; }
        
        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .container {
            max-width:1100px; margin:auto; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px);
            padding:35px; border-radius:24px; border:1px solid rgba(255,255,255,0.05); box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }
        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title h2 { color: #38bdf8; font-weight: 800; font-size: 24px; }
        
        .btn-kembali { background: rgba(255,255,255,0.1); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-kembali:hover { background: rgba(255,255,255,0.2); }

        form { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 15px; margin-bottom: 30px; background: rgba(15, 23, 42, 0.5); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        button { background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56,189,248,0.4); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #94a3b8; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.1); }
        td { padding: 15px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover td { background: rgba(56,189,248,0.05); }
        
        .badge-kat { background: rgba(139, 92, 246, 0.2); color: #c084fc; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .poin-text { color: #facc15; font-weight: bold; }
        .btn-delete { background: rgba(244, 63, 94, 0.1); color: #f43f5e; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; transition: 0.3s; border: 1px solid rgba(244, 63, 94, 0.3); }
        .btn-delete:hover { background: #f43f5e; color: white; }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">
    <div class="header-title">
        <h2>🍿 Database Menu Kantin</h2>
        <a href="/admin" class="btn-kembali">← Kembali ke Dasbor</a>
    </div>

    <form action="/admin/simpan-menu-fb" method="POST" th:object="${menuBaru}">
        <input type="text" name="namaMenu" placeholder="Nama Makanan / Minuman" required>
        <select name="kategori" required>
            <option value="" disabled selected>Kategori</option>
            <option value="Makanan">Makanan</option>
            <option value="Minuman">Minuman</option>
        </select>
        <input type="number" name="hargaRupiah" placeholder="Harga (Rp)" required>
        <input type="number" name="hargaPoin" placeholder="Harga Poin (pts)" required>
        <button type="submit">➕ Tambah</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Nama Menu</th>
            <th>Kategori</th>
            <th>Harga Rupiah</th>
            <th>Harga Poin (Member)</th>
            <th>Aksi</th>
        </tr>
        <tr th:each="m : ${daftarMenu}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.namaMenu}" style="font-weight: 600; color: white;"></td>
            <td><span class="badge-kat" th:text="${m.kategori}"></span></td>
            <td th:text="'Rp ' + ${#numbers.formatDecimal(m.hargaRupiah,0,'COMMA',0,'POINT')}"></td>
            <td class="poin-text" th:text="${m.hargaPoin} + ' pts'"></td>
            <td><a th:href="@{'/admin/hapus-menu-fb/' + ${m.id}}" class="btn-delete" onclick="return confirm('Hapus menu ini?')">Hapus</a></td>
        </tr>
    </table>
</div>

</body>
</html>
