<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Set Durasi - NexaNet Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: #0f172a; color: white; min-height: 100vh; 
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        
        /* ANIMASI BACKGROUND GLOW */
        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .card {
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.05);
            padding: 40px; width: 100%; max-width: 450px; text-align: center;
            backdrop-filter: blur(15px); border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .icon { font-size: 50px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(56,189,248,0.4)); }
        h2 { color: #fff; font-size: 26px; font-weight: 900; margin-bottom: 5px; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }
        .nama-user { color: #38bdf8; font-weight: bold; }

        .form-group { text-align: left; margin-bottom: 25px; }
        label { color: #cbd5e1; font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; text-transform: uppercase; }
        
        input {
            width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; color: #fff; font-size: 18px; font-weight: bold; border-radius: 12px;
            outline: none; transition: 0.3s; text-align: center;
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); background: rgba(15, 23, 42, 0.8); }

        .btn-submit {
            width: 100%; background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a; 
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800;
            border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(56,189,248,0.3);
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(56,189,248,0.5); filter: brightness(1.1); }
        
        .btn-back { display: block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 14px; transition: 0.3s; font-weight: 600; }
        .btn-back:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="card">
        <div class="icon">⏳</div>
        <h2>Atur Durasi</h2>
        <p>Selamat datang kembali, <span class="nama-user" th:text="${user.nama}">Player</span>!</p>

        <form action="/proses-durasi" method="POST">
            <div class="form-group">
                <label>Input Waktu Bermain (Jam)</label>
                <input type="number" name="durasi" min="1" max="24" value="1" required>
            </div>
            
            <button type="submit" class="btn-submit">Konfirmasi & Pilih PC</button>
        </form>
        
        <a href="/member-dashboard" class="btn-back">← Kembali ke Dashboard</a>
    </div>

</body>
</html>
