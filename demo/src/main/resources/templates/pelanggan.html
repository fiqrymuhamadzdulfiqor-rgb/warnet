<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Database Pelanggan - NexaNet Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background: #0f172a; color: white; min-height: 100vh; padding: 40px 20px; position: relative; overflow-x: hidden; }

        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .container {
            max-width: 1100px; margin: auto; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px);
            padding: 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title h1 { color: #38bdf8; font-size: 24px; font-weight: 800; }
        
        .back-btn { background: rgba(255,255,255,0.1); color: white; text-decoration: none; font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: rgba(56,189,248,0.1); color: #38bdf8; padding: 15px; text-align: left; text-transform: uppercase; font-size: 13px; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; font-size: 14px; }
        tr:hover td { background: rgba(56, 189, 248, 0.05); }

        .badge-member { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-umum { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid rgba(148, 163, 184, 0.3); }
        .point-text { color: #facc15; font-weight: bold; }
        
        .hapus-btn { background: rgba(244, 63, 94, 0.1); color: #f43f5e; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; transition: 0.3s; border: 1px solid rgba(244, 63, 94, 0.3); }
        .hapus-btn:hover { background: #f43f5e; color: white; }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">
    
    <div class="header-title">
        <h1>👥 Database Pelanggan</h1>
        <a href="/admin" class="back-btn">← Kembali ke Dashboard</a>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Nama Lengkap</th>
            <th>No. Handphone</th>
            <th>Username</th>
            <th>Status</th>
            <th>Poin Reward</th>
            <th>Aksi</th>
        </tr>
        
        <tr th:each="p : ${pelangganList}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nama}" style="font-weight: 600; color: white;"></td>
            <td th:text="${p.noHp}"></td>
            <td th:text="${p.username != null ? p.username : '-'}"></td>
            <td>
                <span th:if="${p.status == 'MEMBER'}" class="badge-member">MEMBER</span>
                <span th:if="${p.status == 'UMUM'}" class="badge-umum">UMUM</span>
            </td>
            <td>
                <span th:if="${p.status == 'MEMBER'}" th:text="${p.point} + ' pts'" class="point-text"></span>
                <span th:if="${p.status == 'UMUM'}">-</span>
            </td>
            <td>
                <a class="hapus-btn" th:href="@{/delete-pelanggan/{id}(id=${p.id})}" onclick="return confirm('Yakin ingin menghapus pelanggan ini dari sistem?')">Hapus</a>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
