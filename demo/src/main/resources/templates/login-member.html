<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Member - NexaNet Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .bg-glow { position: fixed; top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(50px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -20%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(50px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .login-box {
            width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; position: relative;
        }

        .icon-avatar { font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(56,189,248,0.4)); }
        
        h2 { font-size: 28px; font-weight: 900; margin-bottom: 5px; color: white; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }

        .error-msg { background: rgba(244, 63, 94, 0.2); border: 1px solid #f43f5e; color: #fda4af; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 14px; transition: 0.3s;
        }
        input:focus { outline: none; border-color: #38bdf8; background: rgba(15, 23, 42, 0.9); }
        
        .btn-submit {
            width: 100%; padding: 15px; background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a; border: none;
            border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(56,189,248,0.4); filter: brightness(1.1); }

        .links { margin-top: 25px; font-size: 14px; color: #94a3b8; }
        .links a { color: #38bdf8; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .links a:hover { color: #fff; }
        
        .back-home { position: absolute; top: 30px; left: 30px; color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .back-home:hover { color: white; }
    </style>
</head>
<body>

<a href="/" class="back-home">← Kembali</a>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="login-box">
    <div class="icon-avatar">👨‍🚀</div>
    <h2>Member Area</h2>
    <p class="subtitle">Silakan login untuk main dan kumpulkan poin</p>

    <div th:if="${param.error}" class="error-msg">
        Username atau password salah!
    </div>

    <form action="/login-member" method="post">
        <input type="text" name="username" placeholder="Masukkan Username" required>
        <input type="password" name="password" placeholder="Masukkan Password" required>
        <button type="submit" class="btn-submit">Masuk ke Dashboard</button>
    </form>

    <div class="links">
        Belum punya akun? <a href="/register-member">Daftar sekarang</a>
    </div>
</div>

</body>
</html>
