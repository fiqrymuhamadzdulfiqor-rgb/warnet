<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Pemesanan F&B - NexaNet Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body {
            background: #0f172a; color: white; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 40px 20px; position: relative; overflow-x: hidden;
        }

        /* GLOW BACKGROUND */
        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        /* RECEIPT CARD */
        .receipt-card {
            width: 100%; max-width: 400px;
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px 30px; animation: slideUp 0.6s ease-out;
            position: relative;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }

        /* ZIG-ZAG BORDER (Gaya Kertas Struk) */
        .receipt-card::after {
            content: ""; position: absolute; bottom: -10px; left: 0; width: 100%; height: 20px;
            background: linear-gradient(135deg, transparent 25%, transparent 25%, rgba(30, 41, 59, 0.7) 25%, rgba(30, 41, 59, 0.7) 50%, transparent 50%, transparent 75%, rgba(30, 41, 59, 0.7) 75%, rgba(30, 41, 59, 0.7) 100%);
            background-size: 20px 20px; backdrop-filter: blur(25px);
        }

        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed rgba(255,255,255,0.2); padding-bottom: 20px; }
        .header h1 { color: #38bdf8; font-size: 24px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        .header p { color: #94a3b8; font-size: 13px; margin-top: 5px; }

        .info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
        .info-row strong { color: white; }

        /* ITEM LIST (Monospace Font for thermal receipt look) */
        .item-list { margin: 25px 0; border-top: 1px dashed rgba(255,255,255,0.2); border-bottom: 1px dashed rgba(255,255,255,0.2); padding: 15px 0; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #f1f5f9; }
        .item-name { flex: 1; padding-right: 15px; }
        .item-qty { width: 30px; text-align: center; color: #94a3b8; }
        .item-price { width: 90px; text-align: right; }

        .total-section { text-align: right; margin-top: 20px; }
        .total-text { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .total-amount { font-size: 28px; font-weight: 900; color: #4ade80; text-shadow: 0 0 15px rgba(74, 222, 128, 0.3); }

        .status-badge { display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; border: 1px solid rgba(56, 189, 248, 0.3); }

        .btn-home {
            display: block; width: 100%; text-align: center; padding: 14px;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a;
            text-decoration: none; border-radius: 12px; font-weight: 900; font-size: 14px;
            margin-top: 40px; transition: 0.3s; box-shadow: 0 10px 20px rgba(56,189,248,0.2);
        }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(56,189,248,0.4); filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="receipt-card">
    <div class="header">
        <i class="bi bi-receipt" style="font-size: 40px; color: #38bdf8; filter: drop-shadow(0 0 10px rgba(56,189,248,0.4));"></i>
        <h1>NexaNet Cafe</h1>
        <p>Struk Pesanan F&B Digital</p>
    </div>

    <div>
        <div class="info-row">
            <span>No. Order</span>
            <strong th:text="'#ORD-' + ${nota.id}">#ORD-0</strong>
        </div>
        <div class="info-row">
            <span>Nama / PC</span>
            <strong th:text="${nota.pelanggan != null ? nota.pelanggan.nama : nota.namaPemesanTamu}">Tamu Umum</strong>
        </div>
        <div class="info-row">
            <span>Pembayaran</span>
            <strong th:text="${nota.metodePembayaran}">Tunai</strong>
        </div>
    </div>

    <!-- DAFTAR ITEM PESANAN -->
    <div class="item-list">
        <!-- CATATAN: Ubah 'detailPesanan' jika nama List di entity PesananFB kamu berbeda -->
        <div class="item-row" th:each="detail : ${nota.daftarMenu}">
            <div class="item-name" th:text="${detail.menuFb.namaMenu}">Nasi Goreng Spesial</div>
            <div class="item-qty" th:text="'x' + ${detail.jumlah}">x1</div>
            <div class="item-price" th:text="${#numbers.formatDecimal(detail.subTotalRupiah, 0, 'COMMA', 0, 'POINT')}">15.000</div>
        </div>
    </div>

    <div class="total-section">
        <div class="total-text">Total Tagihan</div>
        <div class="total-amount" th:text="'Rp ' + ${#numbers.formatDecimal(nota.totalHargaRupiah, 0, 'COMMA', 0, 'POINT')}">Rp 0</div>
        <div class="status-badge">
            <i class="bi bi-clock-history"></i> <span th:text="${nota.statusPesanan}">Diproses</span>
        </div>
    </div>
    
    <p style="text-align: center; color: #64748b; font-size: 11px; margin-top: 25px;">
        Harap simpan halaman ini atau lakukan tangkapan layar (screenshot) sebagai bukti pesanan Anda.
    </p>

    <a href="/" class="btn-home">Selesai & Kembali ke Home</a>
</div>

</body>
</html>
