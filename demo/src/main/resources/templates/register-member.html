<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Member - CyberNet</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: white;
            padding: 20px;
        }

        /* CONTAINER CARD WITH NEON GLOW */
        .register-box {
            width: 420px;
            padding: 40px 35px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15), 
                        0 20px 40px rgba(0, 0, 0, 0.5);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* CARD HOVER INTERACTION */
        .register-box:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3), 
                        0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* TYPOGRAPHY */
        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* FORM ELEMENTS */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        /* INPUT INTERACTIVE GLOW */
        input:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        input::placeholder {
            color: #64748b;
            font-size: 14px;
        }

        /* GAMING BUTTON */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
            opacity: 0.95;
        }

        button:active {
            transform: translateY(1px);
        }

        /* BACK NAVIGATION LINK */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>CyberNet</h2>
    <p class="subtitle">Registrasi Akun Member Baru</p>

    <form th:action="@{/register-member}" method="post">
        
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" 
                   name="nama" 
                   placeholder="Masukkan nama lengkap" 
                   required>
        </div>

        <div class="form-group">
            <label>No. Handphone</label>
            <input type="text" 
                   name="noHp" 
                   placeholder="Contoh: 08123456789" 
                   required>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" 
                   name="username" 
                   placeholder="Buat username unik" 
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" 
                   name="password" 
                   placeholder="••••••••" 
                   required>
        </div>

        <button type="submit">⚡ DAFTAR MEMBER</button>

    </form>

    <a href="/login-member" class="back-link">← Sudah punya akun? Login disini</a>
</div>

</body>
</html>
