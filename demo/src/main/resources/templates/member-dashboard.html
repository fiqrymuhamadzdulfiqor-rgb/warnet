<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard Member - CyberNet</title>

```
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Inter', sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: radial-gradient(circle at top, #1e293b, #0f172a);
        color:white;
        padding:20px;
    }

    .card{
        width:500px;
        padding:35px;
        border-radius:18px;
        background: rgba(30, 41, 59, 0.75);
        backdrop-filter: blur(10px);
        border:1px solid rgba(56,189,248,0.15);
        box-shadow:0 20px 40px rgba(0,0,0,0.4);
        text-align:center;
    }

    h2{
        color:#38bdf8;
        margin-bottom:20px;
        font-size:30px;
    }

    .welcome{
        font-size:18px;
        margin-bottom:20px;
        color:#e2e8f0;
    }

    .info-box{
        background: rgba(255,255,255,0.05);
        border-radius:12px;
        padding:20px;
        text-align:left;
        margin-top:15px;
    }

    .info-box p{
        margin:12px 0;
        color:#cbd5e1;
    }

    .info-box b{
        color:white;
    }

    .point-box{
        margin-top:20px;
        padding:20px;
        border-radius:14px;
        background: linear-gradient(90deg,#38bdf8,#0ea5e9);
        color:#0f172a;
    }

    .point-title{
        font-size:15px;
        font-weight:600;
    }

    .point-value{
        font-size:36px;
        font-weight:700;
        margin-top:5px;
    }

    .btn{
        display:block;
        width:100%;
        padding:14px;
        margin-top:20px;
        border:none;
        border-radius:10px;
        text-decoration:none;
        font-weight:700;
        transition:0.3s;
    }

    .btn-primary{
        background: linear-gradient(90deg,#38bdf8,#0ea5e9);
        color:#0f172a;
    }

    .btn-primary:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 20px rgba(56,189,248,0.3);
    }

    .btn-secondary{
        border:1px solid #38bdf8;
        color:#38bdf8;
        background:transparent;
    }

    .btn-secondary:hover{
        background:#38bdf8;
        color:#0f172a;
    }

    .logout{
        display:block;
        margin-top:15px;
        color:#fb7185;
        text-decoration:none;
        font-size:14px;
    }

    .logout:hover{
        text-decoration:underline;
    }

</style>


</head>

<body>

<div class="card">


<h2>👤 Dashboard Member</h2>

<div class="welcome">
    Selamat Datang,
    <b th:text="${user.nama}"></b>
</div>

<div class="info-box">

    <p>
        <b>ID Member :</b>
        <span th:text="${user.id}"></span>
    </p>

    <p>
        <b>Nama :</b>
        <span th:text="${user.nama}"></span>
    </p>

    <p>
        <b>No HP :</b>
        <span th:text="${user.noHp}"></span>
    </p>

    <p>
        <b>Username :</b>
        <span th:text="${user.username}"></span>
    </p>

    <p>
        <b>Status :</b>
        <span th:text="${user.status}"></span>
    </p>

</div>

<div class="point-box">

    <div class="point-title">
        Total Point Member
    </div>

    <div class="point-value"
         th:text="${user.point}">
        0
    </div>

</div>

<a href="/pilih-komputer"
   class="btn btn-primary">
    🎮 Reservasi Komputer
</a>

<a href="/logout"
   class="btn btn-secondary">
    Logout
</a>


</div>

</body>
</html>
