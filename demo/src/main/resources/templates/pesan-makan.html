<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NexaNet Kantin - Pesan Jajanan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { min-height:100vh; background: #0f172a; color:white; padding: 100px 30px; position: relative; padding-bottom: 150px; }

        /* ANIMATED BACKGROUND GLOW */
        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .container { max-width:1200px; margin:auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px); padding: 25px 40px; border-radius: 20px; margin-bottom: 40px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .user-info span { color: #38bdf8; font-weight: 800; }
        .point-info { background: rgba(250, 204, 21, 0.15); border: 1px solid rgba(250, 204, 21, 0.3); padding: 6px 14px; border-radius: 12px; color: #facc15; font-weight: 800; margin-left: 15px; }
        .back-btn { color: #94a3b8; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .back-btn:hover { color: white; }

        .alert-error { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; padding: 15px; border-radius: 12px; margin-bottom: 30px; font-weight: 600; text-align: center; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .menu-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; backdrop-filter: blur(10px); transition: 0.4s; justify-content: space-between; }
        .menu-card:hover { border-color: #38bdf8; transform: translateY(-8px); background: rgba(30, 41, 59, 0.8); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        
        .item-cat { font-size: 11px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1.5px; font-weight: 800; }
        .item-name { font-size: 22px; font-weight: 900; margin: 8px 0 20px 0; color: white; }
        
        .price-row { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .price-cash { font-size: 16px; font-weight: 800; color: #22c55e; }
        .price-point { font-size: 16px; font-weight: 800; color: #facc15; }

        .qty-wrapper { display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.6); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .qty-wrapper label { font-size: 14px; font-weight: 600; color: #94a3b8; }
        .qty-wrapper input { background: transparent; border: none; color: white; font-size: 18px; font-weight: 900; text-align: center; width: 60px; outline: none; }
        .qty-wrapper input:focus { color: #38bdf8; }

        /* PANEL KERANJANG DI BAWAH */
        .checkout-panel {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1200px;
            background: rgba(30, 41, 59, 0.9); border: 1px solid #38bdf8; border-radius: 20px; padding: 25px 40px;
            display: flex; gap: 20px; align-items: center; justify-content: space-between;
            backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 100;
        }
        .checkout-inputs { display: flex; gap: 15px; flex-grow: 1; align-items: center; }
        .checkout-inputs input, .checkout-inputs select {
            padding: 14px 20px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; color: white; font-size: 14px; outline: none; flex: 1; max-width: 300px;
        }
        .checkout-inputs input:focus, .checkout-inputs select:focus { border-color: #38bdf8; }
        .input-manual { border: 1px dashed rgba(56,189,248,0.6) !important; }

        .btn-checkout {
            padding: 16px 40px; background: linear-gradient(90deg, #22c55e, #16a34a); color: white;
            border: none; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s;
            white-space: nowrap; box-shadow: 0 4px 15px rgba(34,197,94,0.3);
        }
        .btn-checkout:hover { filter: brightness(1.2); box-shadow: 0 8px 25px rgba(34,197,94,0.5); transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">
    <div class="top-bar">
        <div class="user-info">
            Status: <span th:text="${currentUser.status}">UMUM</span>
            <span th:if="${currentUser.status == 'MEMBER'}" class="point-info">🪙 <span th:text="${currentUser.point}">0</span> pts</span>
        </div>
        <a href="/" class="back-btn">← Kembali</a>
    </div>

    <div class="alert-error" th:if="${errorPoin}" th:text="${errorPoin}"></div>
    <div class="alert-error" th:if="${param.error}">Gagal memproses pesanan. Periksa poin atau inputanmu.</div>

    <!-- SEMUA MENU DIBUNGKUS DALAM 1 FORM -->
    <form action="/proses-pesan-makan" method="post" id="keranjangForm">
        <div class="menu-grid">
            
            <div class="menu-card" th:each="m : ${daftarMenu}">
                <div>
                    <span class="item-cat" th:text="${m.kategori}">KATEGORI</span>
                    <h3 class="item-name" th:text="${m.namaMenu}">Nama Menu</h3>
                    
                    <div class="price-row">
                        <span class="price-cash" th:text="'Rp ' + ${#numbers.formatDecimal(m.hargaRupiah,0,'COMMA',0,'POINT')}"></span>
                        <span class="price-point" th:text="${m.hargaPoin} + ' pts'"></span>
                    </div>
                </div>

                <!-- Input Hidden untuk ID Menu -->
                <input type="hidden" name="menuIds" th:value="${m.id}">
                <!-- Input Jumlah Makanan (Default 0) -->
                <div class="qty-wrapper">
                    <label>Jumlah Porsi</label>
                    <input type="number" name="jumlahs" value="0" min="0">
                </div>
            </div>

        </div>

        <!-- PANEL CHECKOUT MELAYANG DI BAWAH -->
        <div class="checkout-panel">
            <div class="checkout-inputs">
                <div th:if="${currentUser.id == null}" style="flex:1; max-width: 300px;">
                    <input type="text" name="namaManual" class="input-manual" placeholder="Nama / No. PC (Wajib)" required>
                </div>
                
                <select name="metodePembayaran" required>
                    <option value="Tunai">Bayar Tunai ke Kasir</option>
                    <option value="QRIS">Bayar via QRIS</option>
                    <option th:if="${currentUser.status == 'MEMBER'}" value="Tukar Poin">Tukar Poin Member</option>
                </select>
            </div>
            
            <button type="submit" class="btn-checkout" onclick="return confirm('Proses semua pesanan di keranjang?')">
                🚀 Pesan Sekarang
            </button>
        </div>
    </form>

</div>

</body>
</html>
