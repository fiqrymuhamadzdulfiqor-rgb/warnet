<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CyberCafé - Pesan Makanan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body {
            min-height:100vh; background: radial-gradient(circle at top, #1e293b, #0f172a); color:white; padding:30px;
        }
        .container { max-width:1200px; margin:auto; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px);
            padding: 20px 30px; border-radius: 16px; margin-bottom: 30px;
            border: 1px solid rgba(56,189,248,0.15);
        }
        .user-info span { color: #38bdf8; font-weight: bold; }
        .point-info { background: rgba(250, 204, 21, 0.1); border: 1px dashed #facc15; padding: 6px 12px; border-radius: 8px; color: #facc15; font-weight: bold; }
        
        .back-btn { color: #94a3b8; text-decoration: none; font-weight: 600; }
        .back-btn:hover { color: white; }

        .alert-error {
            background: rgba(244, 63, 94, 0.2); border: 1px solid #f43f5e; color: #fda4af;
            padding: 15px; border-radius: 10px; margin-bottom: 25px; font-weight: 600;
        }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .menu-card {
            background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.3s;
        }
        .menu-card:hover { border-color: #38bdf8; transform: translateY(-3px); background: rgba(30, 41, 59, 0.7); }
        
        .item-cat { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }
        .item-name { font-size: 20px; font-weight: 700; margin: 5px 0 15px 0; color: white; }
        
        .price-row { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .price-cash { font-size: 16px; font-weight: 600; color: #22c55e; }
        .price-point { font-size: 16px; font-weight: 600; color: #facc15; }

        .order-form { display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
        
        input, select {
            padding: 10px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: white; font-size: 13px;
        }
        input:focus, select:focus { border-color: #38bdf8; outline: none; }
        select option { background: #0f172a; }

        .input-manual {
            width: 100%; margin-bottom: 5px; border: 1px dashed rgba(56,189,248,0.4); background: rgba(15, 23, 42, 0.8);
        }

        .order-btn {
            width: 100%; padding: 12px; background: #38bdf8; color: #0f172a;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .order-btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <div class="user-info">
            Status Pembeli: <span th:text="${currentUser.status}">UMUM</span>
            <span th:if="${currentUser.status == 'MEMBER'}" class="point-info">🪙 <span th:text="${currentUser.point}">0</span> pts</span>
        </div>
        <a href="/" class="back-btn">← Ke Halaman Utama</a>
    </div>

    <div class="alert-error" th:if="${errorPoin}" th:text="${errorPoin}"></div>

    <div class="menu-grid">
        <div class="menu-card" th:each="m : ${daftarMenu}">
            <div>
                <span class="item-cat" th:text="${m.kategori}">KATEGORI</span>
                <h3 class="item-name" th:text="${m.namaMenu}">Nama Menu Jajanan</h3>
                
                <div class="price-row">
                    <span class="price-cash" th:text="'Rp ' + ${#numbers.formatDecimal(m.hargaRupiah,0,'COMMA',0,'POINT')}"></span>
                    <span class="price-point" th:text="${m.hargaPoin} + ' pts'"></span>
                </div>
            </div>

            <form action="/proses-pesan-makan" method="post" class="order-form">
                <input type="hidden" name="menuId" th:value="${m.id}">
                
                <div th:if="${currentUser.id == null}">
                    <input type="text" name="namaManual" class="input-manual" placeholder="Ketik Nama / No. PC Kamu (Contoh: PC-05)" required>
                </div>
                
                <div class="form-row">
                    <input type="number" name="jumlah" value="1" min="1" title="Jumlah porsi" required>
                    
                    <select name="metodePembayaran" required>
                        <option value="Tunai">💵 Tunai Kasir</option>
                        <option value="QRIS">📱 QRIS / E-Wallet</option>
                        <option th:if="${currentUser.status == 'MEMBER'}" value="Tukar Poin">🪙 Tukar Poin Member</option>
                    </select>
                </div>
                
                <button type="submit" class="order-btn" onclick="return confirm('Konfirmasi pesanan makanan ini?')">🛒 Beli Jajanan</button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
