<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Billing - NexaNet Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { 
            background: #0f172a; color: white; min-height: 100vh; 
            display: flex; align-items: center; position: relative; overflow-x: hidden; padding: 40px 0;
        }

        /* ANIMATED BACKGROUND GLOW */
        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        /* GLASS CARD */
        .glass-card { 
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out; overflow: hidden;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .invoice-header { 
            background: rgba(15, 23, 42, 0.4); border-bottom: 1px solid rgba(255,255,255,0.05); 
            padding: 30px; text-align: center; 
        }
        
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 12px; }
        
        /* HIGHLIGHT TOTAL HARGA */
        .total-box { 
            background: linear-gradient(145deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05)); 
            border: 1px dashed rgba(34, 197, 94, 0.4); border-radius: 16px; 
            padding: 20px; text-align: center; margin-top: 25px; 
        }
        .total-price { font-size: 36px; color: #4ade80; text-shadow: 0 0 20px rgba(74, 222, 128, 0.4); }

        /* CUSTOM INPUTS */
        .custom-select { 
            background-color: rgba(15, 23, 42, 0.6) !important; color: white !important; 
            border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 12px; 
            transition: 0.3s; 
        }
        .custom-select:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important; }
        .custom-select option { background-color: #0f172a; color: white; }

        /* TYPOGRAPHY & COLORS */
        .text-accent { color: #38bdf8; }
        .text-muted-custom { color: #94a3b8; }
        .icon-glow { filter: drop-shadow(0 0 15px rgba(56,189,248,0.4)); }

        /* BUTTONS */
        .btn-primary-custom { 
            background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a; 
            border: none; border-radius: 12px; font-weight: 900; padding: 16px;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(56,189,248,0.2);
        }
        .btn-primary-custom:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(56,189,248,0.4); filter: brightness(1.1); }
        
        .btn-cancel {
            display: block; text-align: center; margin-top: 15px; color: #94a3b8; 
            text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s;
        }
        .btn-cancel:hover { color: #f43f5e; }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card">
                
                <div class="invoice-header">
                    <h3 class="fw-bold text-white"><i class="bi bi-receipt text-accent icon-glow me-2"></i> Detail Pembayaran</h3>
                    <p class="mb-0 text-muted-custom">Selesaikan pembayaran untuk mulai bermain</p>
                </div>
                
                <div class="card-body p-5">
                    <h5 class="fw-bold mb-4" style="color: #cbd5e1; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">Ringkasan Pesanan</h5>
                    
                    <div class="detail-row">
                        <span class="text-muted-custom">Nama Pemain</span>
                        <strong class="text-white" th:text="${transaksi.pelanggan != null ? transaksi.pelanggan.nama : transaksi.namaPemesanTamu}">Nama</strong>
                    </div>
                    
                    <div class="detail-row">
                        <span class="text-muted-custom">PC yang Dipilih</span>
                        <strong class="text-accent" th:text="${transaksi.komputer.namaKomputer} + ' (' + ${transaksi.komputer.grade != null ? transaksi.komputer.grade : 'Reguler'} + ')'">PC-01</strong>
                    </div>
                    
                    <div class="detail-row">
                        <span class="text-muted-custom">Jenis Paket</span>
                        <strong class="text-white" th:text="${transaksi.jenisPaket}">Reguler</strong>
                    </div>

                    <div class="detail-row">
                        <span class="text-muted-custom">Durasi Bermain</span>
                        <strong class="text-white"><span th:text="${transaksi.durasiJam}">1</span> Jam</strong>
                    </div>

                    <div class="total-box">
                        <p class="text-muted-custom mb-1 fw-bold" style="text-transform: uppercase; font-size: 13px; letter-spacing: 1px;">Total Tagihan</p>
                        <h2 class="fw-bold mb-0 total-price" th:text="'Rp ' + ${#numbers.formatDecimal(transaksi.totalHarga, 0, 'COMMA', 0, 'POINT')}">Rp 0</h2>
                    </div>

                    <hr class="my-5" style="border-color: rgba(255,255,255,0.1);">

                    <!-- Form Pembayaran -->
                    <form th:action="@{/pembayaran}" method="post">
                        <h5 class="fw-bold mb-3" style="color: #cbd5e1; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Metode Pembayaran</h5>
                        
                        <!-- Pilihan Metode -->
                        <div class="mb-4">
                            <select name="metode" class="form-select form-select-lg custom-select" required>
                                <option value="" disabled selected>-- Pilih Metode Pembayaran --</option>
                                <option value="CASH">Tunai (Bayar di Kasir)</option>
                                <option value="QRIS">QRIS / E-Wallet</option>
                                <option value="TRANSFER">Transfer Bank</option>
                            </select>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary-custom">
                                <i class="bi bi-check2-circle fs-5 me-2" style="vertical-align: middle;"></i> Konfirmasi & Bayar
                            </button>
                        </div>
                        
                        <!-- Tombol Batal agar pelanggan bisa mundur jika salah pilih PC -->
                        <a th:href="${session.user != null ? '/member-dashboard' : '/'}" class="btn-cancel">Batalkan Transaksi</a>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
