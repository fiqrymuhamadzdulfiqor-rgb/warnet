<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran - NexaNet Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ANIMATED BACKGROUND GLOW */
        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .card {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .info { margin-bottom: 30px; background: rgba(15, 23, 42, 0.4); padding: 20px; border-radius: 16px; }

        .info p { margin: 12px 0; display: flex; justify-content: space-between; color: #94a3b8; font-size: 15px; }
        .info b { color: #f1f5f9; }

        select {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        select:focus { border-color: #38bdf8; }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(56,189,248,0.2);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(56,189,248,0.4);
            filter: brightness(1.1);
        }
    </style>
</head>

<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="card">
    <h2>Pembayaran</h2>

    <div class="info">
        <p>Komputer: <b th:text="${transaksi.komputer.namaKomputer}">PC-00</b></p>
        <p>Durasi: <b th:text="${transaksi.jam} + ' Jam'">0 Jam</b></p>
        <p>Total: <b>Rp <span th:text="${transaksi != null ? #numbers.formatInteger(transaksi.total, 0, 'POINT') : '0'}">0</span></b></p>
    </div>

    <form action="/pembayaran" method="post">
        <select name="metode" required>
            <option value="" disabled selected>Pilih Metode Pembayaran</option>
            <option value="Cash">Cash (Tunai)</option>
            <option value="QRIS">QRIS (E-Wallet)</option>
            <option value="Transfer">Transfer Bank</option>
        </select>

        <button type="submit">Bayar Sekarang</button>
    </form>
</div>

</body>
</html>
