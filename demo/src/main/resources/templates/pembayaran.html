<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pembayaran</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background: radial-gradient(circle at top,#1e293b,#0f172a);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:500px;
            background:rgba(30,41,59,0.7);
            padding:30px;
            border-radius:15px;
        }

        h2{
            text-align:center;
            color:#38bdf8;
            margin-bottom:20px;
        }

        .info{
            margin-bottom:20px;
        }

        .info p{
            margin:10px 0;
        }

        select{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:black;
            font-weight:bold;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="card">

    <h2>Pembayaran</h2>

    <div class="info">

        <p>
            Komputer :
            <b th:text="${transaksi.komputer.namaKomputer}"></b>
        </p>

        <p>
            Jam :
            <b th:text="${transaksi.jam}"></b>
        </p>

        <p>
            Total :
            Rp
            <b th:text="${transaksi.total}"></b>
        </p>

    </div>

    <form action="/pembayaran" method="post">

        <select name="metode" required>

            <option value="">Pilih Metode</option>

            <option value="Cash">
                Cash
            </option>

            <option value="QRIS">
                QRIS
            </option>

            <option value="Transfer">
                Transfer Bank
            </option>

        </select>

        <button type="submit">
            Bayar Sekarang
        </button>

    </form>

</div>

</body>
</html>
