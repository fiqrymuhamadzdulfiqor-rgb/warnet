<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manajemen PC - NexaNet Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background: #0f172a; color: white; min-height: 100vh; padding: 40px 20px; position: relative; overflow-x: hidden; }

        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .container {
            max-width: 1100px; margin: auto; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px);
            padding: 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title h1 { color: #38bdf8; font-size: 24px; font-weight: 800; }
        
        .back-btn { background: rgba(255,255,255,0.1); color: white; text-decoration: none; font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        /* FORM STYLE */
        form {
            display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 15px; align-items: center;
            background: rgba(15, 23, 42, 0.5); padding: 20px; border-radius: 16px; margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        input { padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; width: 100%; font-size: 14px;}
        input:focus { border-color: #38bdf8; }
        button { background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56,189,248,0.4); }

        /* TABLE STYLE */
        table { width:100%; border-collapse:collapse; }
        th { background: rgba(56,189,248,0.1); color: #38bdf8; padding: 15px; text-align: left; font-size: 13px; text-transform: uppercase;}
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; font-size: 14px;}
        tr:hover td { background: rgba(56,189,248,0.05); }

        .status-tersedia { color: #4ade80; font-weight: 600; }
        .status-dipakai { color: #f43f5e; font-weight: 600; }

        /* ACTIONS ACTION BUTTONS */
        .action-link { text-decoration: none; font-size: 13px; font-weight: 600; margin-right: 15px; }
        .edit { color: #38bdf8; }
        .edit:hover { text-decoration: underline; }
        .hapus { color: #fb7185; }
        .hapus:hover { text-decoration: underline; }
        .btn-stop {
            background: rgba(225, 29, 72, 0.1); color: #f43f5e; padding: 6px 12px; border-radius: 6px;
            text-decoration: none; font-size: 12px; font-weight: bold; display: inline-block; transition: 0.2s; border: 1px solid rgba(225, 29, 72, 0.3);
        }
        .btn-stop:hover { background: #e11d48; color: white; box-shadow: 0 0 10px rgba(225,29,72,0.4); }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">

    <div class="header-title">
        <h1>🖥️ Manajemen Komputer (Billing)</h1>
        <a href="/admin" class="back-btn">← Kembali ke Dashboard</a>
    </div>

    <form action="/save-komputer" method="post">
        <input type="hidden" name="id" th:value="${komputer.id}">
        <input type="hidden" name="status" th:value="${komputer.status != null ? komputer.status : 'Tersedia'}">

        <input type="text" name="namaKomputer" placeholder="Nama Komputer (Contoh: PC-01)" th:value="${komputer.namaKomputer}" required>
        <input type="number" name="tarifPerJam" placeholder="Tarif Per Jam (Rp)" th:value="${komputer.tarifPerJam}" required>
        
        <button type="submit">💾 Simpan PC</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Nama Komputer</th>
            <th>Status PC</th>
            <th>Tarif / Jam</th>
            <th>Aksi Kontrol</th>
        </tr>

        <tr th:each="k : ${komputerList}">
            <td th:text="${k.id}"></td>
            <td th:text="${k.namaKomputer}" style="font-weight: 600; color: white;"></td>
            <td>
                <span th:if="${k.status == 'Tersedia'}" class="status-tersedia">🟢 Tersedia</span>
                <span th:if="${k.status == 'Dipakai'}" class="status-dipakai">🔴 Dipakai</span>
            </td>
            <td th:text="'Rp ' + ${#numbers.formatDecimal(k.tarifPerJam,0,'COMMA',0,'POINT')}"></td>
            <td>
                <a th:if="${k.status == 'Dipakai'}" 
                   th:href="@{/akhiri-sesi/{id}(id=${k.id})}" 
                   class="btn-stop"
                   onclick="return confirm('Apakah Anda yakin ingin menghentikan billing PC ini?')">🛑 Akhiri Sesi</a>

                <a class="action-link edit" th:href="@{/edit-komputer/{id}(id=${k.id})}">✏️ Edit</a>
                <a class="action-link hapus" th:href="@{/delete-komputer/{id}(id=${k.id})}" onclick="return confirm('Hapus PC ini dari database?')">🗑️ Hapus</a>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
