<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manajemen PC - CyberNet Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body {
            min-height:100vh; background: radial-gradient(circle at top, #1e293b, #0f172a); color:white; padding:30px;
        }
        .container {
            max-width:1100px; margin:auto; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px);
            padding:30px; border-radius:18px; border:1px solid rgba(56,189,248,0.15); box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }
        .header-title {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-title h1 { color: #38bdf8; font-size: 24px; }
        .back-btn {
            color: #94a3b8; text-decoration: none; font-weight: 600; padding: 8px 16px;
            border-radius: 8px; border: 1px solid #94a3b8; transition: 0.3s;
        }
        .back-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        /* FORM STYLE */
        form {
            display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 15px; align-items: center;
            background: rgba(15, 23, 42, 0.4); padding: 20px; border-radius: 12px; margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        input {
            width:100%; padding:12px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(56,189,248,0.2);
            border-radius:8px; color: white; font-size: 14px;
        }
        input:focus { border-color: #38bdf8; outline: none; }
        button {
            padding:12px 24px; background:#38bdf8; color:#0f172a; font-weight:bold;
            border:none; border-radius:8px; cursor:pointer; transition: 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* TABLE STYLE */
        table { width:100%; border-collapse:collapse; }
        th { background: rgba(56,189,248,0.1); color: #38bdf8; padding: 15px; text-align: left; font-size: 14px;}
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; font-size: 14px;}
        tr:hover td { background: rgba(255,255,255,0.02); }

        .status-tersedia { color: #4ade80; font-weight: 600; }
        .status-dipakai { color: #f43f5e; font-weight: 600; }

        /* ACTIONS ACTION BUTTONS */
        .action-link { text-decoration: none; font-size: 13px; font-weight: 600; margin-right: 10px; }
        .edit { color: #38bdf8; }
        .edit:hover { text-decoration: underline; }
        .hapus { color: #fb7185; }
        .hapus:hover { text-decoration: underline; }
        .btn-stop {
            background: #e11d48; color: white; padding: 6px 12px; border-radius: 6px;
            text-decoration: none; font-size: 12px; font-weight: bold; display: inline-block; transition: 0.2s;
        }
        .btn-stop:hover { background: #be123c; box-shadow: 0 0 10px rgba(225,29,72,0.4); }
    </style>
</head>
<body>

<div class="container">

    <div class="header-title">
        <h1>🖥️ Manajemen Komputer (Billing)</h1>
        <a href="/admin" class="back-btn">← Kembali ke Dashboard</a>
    </div>

    <form action="/save-komputer" method="post">
        <input type="hidden" name="id" th:value="${komputer.id}">
        <input type="hidden" name="status" th:value="${komputer.status != null ? komputer.status : 'Tersedia'}">

        <input type="text" name="namaKomputer" placeholder="Nama Komputer (Contoh: PC-01)" th:value="${komputer.namaKomputer}" required>
        <input type="number" name="tarifPerJam" placeholder="Tarif Per Jam (Rp)" th:value="${komputer.tarifPerJam}" required>
        
        <button type="submit">💾 Simpan PC</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Nama Komputer</th>
            <th>Status PC</th>
            <th>Tarif / Jam</th>
            <th>Aksi Kontrol</th>
        </tr>

        <tr th:each="k : ${komputerList}">
            <td th:text="${k.id}"></td>
            <td th:text="${k.namaKomputer}" style="font-weight: 600; color: white;"></td>
            <td>
                <span th:if="${k.status == 'Tersedia'}" class="status-tersedia">🟢 Tersedia</span>
                <span th:if="${k.status == 'Dipakai'}" class="status-dipakai">🔴 Dipakai</span>
            </td>
            <td th:text="'Rp ' + ${#numbers.formatDecimal(k.tarifPerJam,0,'COMMA',0,'POINT')}"></td>
            <td>
                <a th:if="${k.status == 'Dipakai'}" 
                   th:href="@{/akhiri-sesi/{id}(id=${k.id})}" 
                   class="btn-stop"
                   onclick="return confirm('Apakah Anda yakin ingin menghentikan billing PC ini?')">🛑 Akhiri Sesi</a>

                <a class="action-link edit" th:href="@{/edit-komputer/{id}(id=${k.id})}">✏️ Edit</a>
                <a class="action-link hapus" th:href="@{/delete-komputer/{id}(id=${k.id})}" onclick="return confirm('Hapus PC ini dari database?')">🗑️ Hapus</a>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
