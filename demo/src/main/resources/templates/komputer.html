<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Komputer</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter', sans-serif;
        }

        body{
            min-height:100vh;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color:white;
            padding:30px;
        }

        .container{
            max-width:1100px;
            margin:auto;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            padding:30px;
            border-radius:18px;
            border:1px solid rgba(56,189,248,0.15);
            box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            font-size:36px;
            background: linear-gradient(90deg, #38bdf8, #60a5fa);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        /* FORM */
        form{
            background: rgba(255,255,255,0.05);
            padding:25px;
            border-radius:14px;
            margin-bottom:30px;
            border:1px solid rgba(255,255,255,0.08);
        }

        input, select{
            width:100%;
            padding:14px;
            margin-top:12px;
            border:none;
            border-radius:10px;
            background: rgba(255,255,255,0.08);
            color:white;
            outline:none;
        }

        select option{
            color:black;
        }

        input::placeholder{
            color:#cbd5e1;
        }

        button{
            margin-top:18px;
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            color:#0f172a;
            font-weight:700;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 20px rgba(56,189,248,0.3);
        }

        /* TABLE */
        table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:14px;
            background: rgba(255,255,255,0.05);
        }

        th, td{
            padding:14px;
            text-align:center;
        }

        th{
            background: rgba(56,189,248,0.2);
            color:#38bdf8;
        }

        tr{
            transition:0.2s;
        }

        tr:hover{
            background: rgba(255,255,255,0.05);
        }

        /* STATUS */
        .status-tersedia{
            color:#22c55e;
            font-weight:700;
        }

        .status-dipakai{
            color:#ef4444;
            font-weight:700;
        }

        /* ACTION */
        a{
            text-decoration:none;
            font-weight:600;
            margin:5px;
        }

        .edit{
            color:#38bdf8;
        }

        .hapus{
            color:#fb7185;
        }

        /* BACK */
        .kembali{
            display:inline-block;
            margin-top:25px;
            padding:12px 18px;
            border-radius:10px;
            background:transparent;
            border:1px solid #38bdf8;
            color:#38bdf8;
            font-weight:600;
            transition:0.3s;
        }

        .kembali:hover{
            background:#38bdf8;
            color:#0f172a;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>💻 Data Komputer</h1>

    <form action="/save-komputer" method="post">

        <input type="hidden" name="id" th:value="${komputer.id}">

        <input type="text"
               name="namaKomputer"
               placeholder="Nama Komputer"
               th:value="${komputer.namaKomputer}"
               required>

        <select name="status" required>

            <option value="">-- Pilih Status --</option>

            <option value="Tersedia"
                    th:selected="${komputer.status == 'Tersedia'}">
                Tersedia
            </option>

            <option value="Dipakai"
                    th:selected="${komputer.status == 'Dipakai'}">
                Dipakai
            </option>

        </select>

        <input type="number"
               name="tarifPerJam"
               placeholder="Tarif Per Jam"
               th:value="${komputer.tarifPerJam}"
               required>

        <button type="submit">💾 Simpan Data</button>

    </form>

    <table>

        <tr>
            <th>ID</th>
            <th>Nama Komputer</th>
            <th>Status</th>
            <th>Tarif / Jam</th>
            <th>Aksi</th>
        </tr>

        <tr th:each="komputer : ${komputerList}">

            <td th:text="${komputer.id}"></td>

            <td th:text="${komputer.namaKomputer}"></td>

            <td>
                <span th:if="${komputer.status == 'Tersedia'}" class="status-tersedia">
                    🟢 Tersedia
                </span>

                <span th:if="${komputer.status == 'Dipakai'}" class="status-dipakai">
                    🔴 Dipakai
                </span>
            </td>

            <td th:text="'Rp ' + ${komputer.tarifPerJam}"></td>

            <td>
                <a class="edit"
                   th:href="@{/edit-komputer/{id}(id=${komputer.id})}">
                    ✏ Edit
                </a>

                <a class="hapus"
                   th:href="@{/delete-komputer/{id}(id=${komputer.id})}"
                   onclick="return confirm('Yakin ingin menghapus data?')">
                    🗑 Hapus
                </a>
            </td>

        </tr>

    </table>

    <a href="/admin" class="back">
    ← Kembali ke Dashboard Admin
    </a>

</div>

</body>
</html>
