<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transaksi Berhasil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body {
            min-height:100vh; display:flex; justify-content:center; align-items:center;
            background: radial-gradient(circle at top,#1e293b,#0f172a); color:white;
        }
        .card {
            width:500px; background:rgba(30,41,59,0.7); backdrop-filter:blur(10px);
            padding:35px; border-radius:16px; border:1px solid rgba(56,189,248,0.15);
            box-shadow:0 20px 40px rgba(0,0,0,0.4); text-align:center;
        }
        .success { font-size:60px; margin-bottom:10px; }
        h1 { color:#22c55e; margin-bottom:25px; font-size:24px; }
        .info { text-align:left; background:rgba(15,23,42,0.6); padding:20px; border-radius:12px; margin-bottom:25px; }
        .info p { margin:10px 0; font-size:16px; }
        .label { color:#38bdf8; font-weight:600; display:inline-block; width:110px; }
        .btn {
            display:inline-block; margin-top:10px; padding:12px 24px;
            background:linear-gradient(90deg, #38bdf8, #0ea5e9); color:#0f172a;
            text-decoration:none; border-radius:10px; font-weight:700;
        }
        .btn:hover { opacity:0.9; }
        .kode-akses-box {
            margin-top: 20px; padding: 15px; background: rgba(34, 197, 94, 0.1);
            border: 1px dashed #22c55e; border-radius: 8px; text-align: center;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="success">✅</div>
    <h1>Pembayaran Berhasil</h1>

    <div class="info">
        <p><span class="label">Nama</span> : <span th:text="${transaksi.pelanggan.nama}"></span></p>
        <p><span class="label">Komputer</span> : <span th:text="${transaksi.komputer.namaKomputer}"></span></p>
        <p><span class="label">Durasi</span> : <span th:text="${transaksi.jam} + ' Jam'"></span></p>
        <p><span class="label">Total Bayar</span> : Rp <span th:text="${transaksi.total}"></span></p>

        <div th:if="${transaksi.pelanggan.status == 'UMUM'}" class="kode-akses-box">
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 5px;">Gunakan kode di bawah ini untuk login PC:</p>
            <span style="font-size: 28px; font-weight: bold; color: #22c55e; letter-spacing: 4px;" th:text="${transaksi.kodeAkses}"></span>
        </div>

        <div th:if="${transaksi.pelanggan.status == 'MEMBER'}" style="margin-top: 15px; text-align: center;">
            <p style="color: #22c55e; font-weight: bold; font-size: 15px;">🎉 Diskon Member 15% Berhasil!</p>
            <p style="color: #38bdf8; font-size: 13px; margin-top: 5px;">(PC langsung aktif, silakan menuju meja Anda)</p>
        </div>
    </div>

    <a th:if="${session.user != null}" href="/member-dashboard" class="btn">Kembali ke Dashboard</a>
    <a th:if="${session.user == null}" href="/" class="btn">Kembali ke Home</a>

</div>

</body>
</html>
