<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaksi Berhasil - NexaNet Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body {
            min-height:100vh; display:flex; justify-content:center; align-items:center;
            background: #0f172a; color:white; padding: 20px; overflow-x: hidden;
        }

        /* ANIMATED BACKGROUND GLOW */
        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .card {
            width:100%; max-width:450px; 
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align:center; animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        
        .success-icon { font-size: 60px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(34,197,94,0.4)); }
        h1 { color: #22c55e; margin-bottom: 10px; font-size: 24px; font-weight: 900; }
        .sub-text { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        
        .info { 
            text-align:left; background: rgba(15, 23, 42, 0.6); 
            padding: 25px; border-radius: 16px; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info p { display: flex; justify-content: space-between; margin: 12px 0; font-size: 14px; }
        .label { color:#94a3b8; font-weight: 600; }
        .value { color: #f1f5f9; font-weight: 700; }
        
        .kode-akses-box {
            margin-top: 25px; padding: 20px; 
            background: rgba(34, 197, 94, 0.08);
            border: 1px dashed #22c55e; border-radius: 12px;
        }
        
        .btn {
            display:block; width: 100%; padding:15px;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9); color: #0f172a;
            text-decoration:none; border-radius:12px; font-weight:900;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(56,189,248,0.2); margin-top: 20px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(56,189,248,0.4); filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="card">
    <div class="success-icon">✅</div>
    <h1>Pembayaran Berhasil</h1>
    <p class="sub-text">Sesi gaming Anda telah dikonfirmasi di NexaNet Cafe.</p>

    <div class="info">
        <p><span class="label">Nama</span> <span class="value" th:text="${transaksi.pelanggan != null ? transaksi.pelanggan.nama : transaksi.namaPemesanTamu}"></span></p>
        <p><span class="label">Komputer</span> <span class="value" th:text="${transaksi.komputer.namaKomputer}"></span></p>
        <p><span class="label">Jenis Paket</span> <span class="value" th:text="${transaksi.jenisPaket}"></span></p>
        
        <!-- LOGIKA TAMPILAN DURASI DINAMIS -->
        <p>
            <span class="label">Durasi/Info</span> 
            <span class="value" th:text="${transaksi.jenisPaket == 'Reguler' ? transaksi.durasiJam + ' Jam' : 'Paket Sepuasnya'}"></span>
        </p>

        <p><span class="label">Total Bayar</span> 
           <span class="value" th:text="'Rp ' + ${#numbers.formatDecimal(transaksi.totalHarga, 0, 'POINT', 0, 'POINT')}"></span>
        </p>
    </div>

    <!-- KOTAK KODE AKSES (Mencegah Error dengan pengecekan status yang lebih aman) -->
    <div class="kode-akses-box" th:style="${transaksi.pelanggan != null && transaksi.pelanggan.status == 'MEMBER'} ? 'border-color: #38bdf8; background: rgba(56, 189, 248, 0.08);' : ''">
        <p style="color: #94a3b8; font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">
            <span th:text="${transaksi.pelanggan != null && transaksi.pelanggan.status == 'MEMBER'} ? 'INFO LOGIN' : 'KODE AKSES PC'"></span>
        </p>
        <span style="font-size: 24px; font-weight: 900; color: #22c55e; letter-spacing: 3px;" 
              th:text="${transaksi.pelanggan != null && transaksi.pelanggan.status == 'MEMBER'} ? 'GUNAKAN AKUN MEMBER' : ${transaksi.kodeAkses}"></span>
    </div>
    
    <a th:if="${session.user != null}" href="/member-dashboard" class="btn">Kembali ke Dashboard</a>
    <a th:if="${session.user == null}" href="/" class="btn">Kembali ke Home</a>
</div>

</body>
</html>
