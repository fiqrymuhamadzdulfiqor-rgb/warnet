<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Data Transaksi</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background: radial-gradient(circle at top,#1e293b,#0f172a);
            color:white;
            padding:30px;
        }

        .container{
            max-width:1200px;
            margin:auto;
            background:rgba(30,41,59,0.6);
            backdrop-filter:blur(10px);
            padding:30px;
            border-radius:15px;
        }

        h1{
            text-align:center;
            color:#38bdf8;
            margin-bottom:25px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#38bdf8;
            color:#0f172a;
            padding:14px;
        }

        td{
            padding:14px;
            text-align:center;
            border-bottom:1px solid rgba(255,255,255,.1);
        }

        tr:hover{
            background:rgba(255,255,255,.05);
        }

        .tersedia{
            background:#22c55e;
            padding:5px 10px;
            border-radius:20px;
        }

        .dipakai{
            background:#ef4444;
            padding:5px 10px;
            border-radius:20px;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            color:#38bdf8;
            text-decoration:none;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>💳 Data Transaksi</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Pelanggan</th>
            <th>Komputer</th>
            <th>Status PC</th>
            <th>Jam</th>
            <th>Tarif/Jam</th>
            <th>Total</th>
        </tr>

        <tr th:each="t : ${transaksiList}">

            <td th:text="${t.id}"></td>

            <td th:text="${t.pelanggan.nama}"></td>

            <td th:text="${t.komputer.namaKomputer}"></td>

            <td>

                <span th:if="${t.komputer.status == 'Tersedia'}"
                      class="tersedia">
                    Tersedia
                </span>

                <span th:if="${t.komputer.status == 'Dipakai'}"
                      class="dipakai">
                    Dipakai
                </span>

            </td>

            <td th:text="${t.jam}"></td>

            <td th:text="${t.tarif}"></td>

            <td th:text="${t.total}"></td>

        </tr>

    </table>

    <a href="/admin" class="back">
        ← Kembali ke Dashboard Admin
    </a>

</div>

</body>
</html>
