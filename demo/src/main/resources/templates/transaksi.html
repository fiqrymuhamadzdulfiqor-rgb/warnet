<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Laporan Transaksi - NexaNet Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background: #0f172a; color: white; min-height: 100vh; padding: 40px 20px; position: relative; overflow-x: hidden; }

        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 8s infinite alternate; }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); z-index: -1; filter: blur(60px); animation: pulse 6s infinite alternate-reverse; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

        .container {
            max-width: 1100px; margin: auto; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(15px);
            padding: 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-title h1 { color: #38bdf8; font-size: 24px; font-weight: 800; }
        
        .back-btn { background: rgba(255,255,255,0.1); color: white; text-decoration: none; font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        table { width:100%; border-collapse:collapse; }
        th { background: rgba(56,189,248,0.1); color: #38bdf8; padding: 15px; text-align: left; font-size: 13px; text-transform: uppercase;}
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; font-size: 14px;}
        tr:hover td { background: rgba(56,189,248,0.05); }

        .status-aktif { color: #facc15; font-weight: 600; background: rgba(250, 204, 21, 0.1); padding: 4px 10px; border-radius: 6px; font-size: 12px;}
        .status-selesai { color: #4ade80; font-weight: 600; background: rgba(34, 197, 94, 0.1); padding: 4px 10px; border-radius: 6px; font-size: 12px;}
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">
    <div class="header-title">
        <h1>📄 Laporan Transaksi PC</h1>
        <a href="/admin" class="back-btn">← Kembali ke Dashboard</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama Pelanggan</th>
                <th>Komputer</th>
                <th>Paket & Durasi</th>
                <th>Total Pendapatan</th>
                <th>Status Sesi</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${transaksiList}">
                <td th:text="${t.id}"></td>
                
                <!-- PENYESUAIAN: Mengecek apakah yang main Member atau Tamu -->
                <td style="font-weight: 600; color: white;" 
                    th:text="${t.pelanggan != null ? t.pelanggan.nama : (t.namaPemesanTamu != null ? t.namaPemesanTamu : 'Anonim')}">
                </td>
                
                <td th:text="${t.komputer != null ? t.komputer.namaKomputer : 'Dihapus'}"></td>
                
                <!-- PENYESUAIAN: Memanggil nama variabel yang baru -->
                <td th:text="${t.jenisPaket} + ' (' + ${t.durasiJam} + ' Jam)'"></td>
                
                <td th:text="'Rp ' + ${#numbers.formatDecimal(t.totalHarga, 0, 'COMMA', 0, 'POINT')}"></td>
                
                <td>
                    <span th:if="${t.statusBermain == 'Aktif'}" class="status-aktif">⏳ Aktif</span>
                    <span th:if="${t.statusBermain == 'Selesai'}" class="status-selesai">✅ Selesai</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(transaksiList)}">
                <td colspan="6" style="text-align: center; color: #94a3b8; padding: 30px;">
                    Belum ada data transaksi tersimpan.
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
