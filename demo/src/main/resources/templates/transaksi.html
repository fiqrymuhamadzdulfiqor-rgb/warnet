<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Laporan Transaksi - CyberNet Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            min-height: 100vh; background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: white; padding: 40px 20px;
        }

        .container {
            max-width: 1200px; margin: auto; background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px); padding: 30px; border-radius: 16px;
            border: 1px solid rgba(56,189,248,0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header-title {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-title h1 { color: #38bdf8; font-size: 24px; }
        
        .back-btn {
            color: #94a3b8; text-decoration: none; font-weight: 600;
            padding: 8px 16px; border-radius: 8px; border: 1px solid #94a3b8; transition: 0.3s;
        }
        .back-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: rgba(56,189,248,0.1); color: #38bdf8; padding: 15px; text-align: left; font-size: 14px;}
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; font-size: 14px;}
        tr:hover td { background: rgba(255,255,255,0.02); }

        .badge { padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-member { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-umum { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }
        
        .kode-akses { 
            font-family: monospace; font-size: 14px; letter-spacing: 2px; 
            color: #facc15; font-weight: bold; background: rgba(250, 204, 21, 0.1); 
            padding: 4px 8px; border-radius: 4px; border: 1px dashed rgba(250, 204, 21, 0.5);
        }
        .waktu-text { color: #cbd5e1; font-size: 13px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-title">
        <h1>💳 Laporan Transaksi Keseluruhan</h1>
        <a href="/admin" class="back-btn">← Kembali ke Dashboard</a>
    </div>

    <table>
        <tr>
            <th>Waktu Transaksi</th>
            <th>Pelanggan</th>
            <th>Tipe User</th>
            <th>Komputer</th>
            <th>Durasi</th>
            <th>Total Bayar</th>
            <th>Kode Akses</th>
        </tr>
        
        <tr th:each="t : ${transaksiList}">
            <td class="waktu-text">
                <span th:if="${t.tanggalTransaksi != null}" th:text="${#temporals.format(t.tanggalTransaksi, 'dd MMM yyyy, HH:mm')}"></span>
                <span th:if="${t.tanggalTransaksi == null}">- Data Lama -</span>
            </td>

            <td th:text="${t.pelanggan.nama}" style="font-weight: 600; color: white;"></td>
            <td>
                <span th:if="${t.pelanggan.status == 'MEMBER'}" class="badge badge-member">MEMBER</span>
                <span th:if="${t.pelanggan.status == 'UMUM'}" class="badge badge-umum">UMUM</span>
            </td>
            <td th:text="${t.komputer.namaKomputer}"></td>
            <td th:text="${t.jam} + ' Jam'"></td>
            <td th:text="'Rp ' + ${#numbers.formatDecimal(t.total,0,'COMMA',0,'POINT')}"></td>
            
            <td>
                <span th:if="${t.kodeAkses != null}" th:text="${t.kodeAkses}" class="kode-akses"></span>
                <span th:if="${t.kodeAkses == null}">-</span>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
