<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Data Pembayaran - CyberNet</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter', sans-serif;
        }

        body{
            min-height:100vh;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color:white;
            padding:30px;
        }

        .container{
            max-width:1200px;
            margin:auto;
            background: rgba(30,41,59,0.7);
            backdrop-filter: blur(10px);
            padding:30px;
            border-radius:16px;
            border:1px solid rgba(56,189,248,0.15);
            box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }

        h1{
            text-align:center;
            color:#38bdf8;
            margin-bottom:25px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background: rgba(255,255,255,0.05);
            border-radius:12px;
            overflow:hidden;
        }

        th, td{
            padding:14px;
            text-align:center;
        }

        th{
            background:#38bdf8;
            color:#0f172a;
        }

        tr:hover{
            background:rgba(255,255,255,0.05);
        }

        .badge{
            background:#22c55e;
            color:white;
            padding:5px 12px;
            border-radius:20px;
            font-size:13px;
            font-weight:bold;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            color:#94a3b8;
            font-weight:600;
        }

        .back:hover{
            color:#38bdf8;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>💳 Data Pembayaran</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Nama Pelanggan</th>
            <th>Komputer</th>
            <th>Metode</th>
            <th>Total Bayar</th>
            <th>Status</th>
        </tr>

        <tr th:each="p : ${pembayaranList}">

            <td th:text="${p.id}"></td>

            <td th:text="${p.transaksi.pelanggan.nama}"></td>

            <td th:text="${p.transaksi.komputer.namaKomputer}"></td>

            <td th:text="${p.metode}"></td>

            <td>
                Rp <span th:text="${#numbers.formatDecimal(p.jumlahBayar,0,'POINT',0,'COMMA')}"></span>
            </td>

            <td>
                <span class="badge">Lunas</span>
            </td>

        </tr>

    </table>

    <a href="/admin" class="back">
        ← Kembali ke Dashboard Admin
    </a>

</div>

</body>
</html>
